[package]
name = "nestbruno"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "Incrementally synchronizes NestJS controllers into a Bruno API collection"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Silent-Watcher/nestbruno"
keywords = ["nestjs", "bruno", "api", "sync", "cli"]
categories = ["development-tools", "command-line-utilities"]
publish = true
# Keep the published crate lean: source, tests, benches and the mandatory
# metadata files. The website, internal engineering docs and agent context
# files live in the repository but are not part of the distributed package.
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/proptest-regressions/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
name = "nestbruno"
path = "src/lib.rs"

[[bin]]
name = "nestbruno"
path = "src/main.rs"

[dependencies]
# CLI parsing: derive API keeps the command structure declarative.
clap = { version = "4", features = ["derive"] }
# Configuration file format (nestbruno.toml) and its typed deserialization.
serde = { version = "1", features = ["derive"] }
toml = "1"
# Machine-readable `--format json` output (Phase 14.1). std has no JSON
# serializer; serde_json is the de-facto standard companion of serde.
serde_json = "1"
# Error enum boilerplate (Display/Error/From). Pure derive macro, no runtime cost.
thiserror = "2"
# Atomic file creation/replacement (temp file in the target directory, then
# no-clobber link or rename). Hand-rolling unique temp names and the
# no-clobber/replace persistence logic is error-prone; tempfile is mature,
# ubiquitous and already a dev-dependency.
tempfile = "3"
# Include/exclude glob matching. Compiles many patterns into one matcher and
# matches paths as bytes (non-UTF-8 safe). std has no glob support; regex-based
# matching would reimplement globset badly. Maintained by the ripgrep author.
globset = "0.4.20"
# TypeScript parser (oxc, MIT). One parser for the whole project: it parses
# TypeScript with decorators natively, recovers from errors, is arena allocated
# (cheap to discard per file) and is in active, widespread use. std has no
# parser; regexes are not allowed for semantic extraction. The four crates are
# one release train and must be bumped together; 0.116 is the newest release
# that builds on Rust 1.91, which is why rust-version is 1.91.
oxc_allocator = "0.116"
oxc_ast = "0.116"
oxc_parser = "0.116"
oxc_span = "0.116"
# Filesystem notifications (inotify / FSEvents / ReadDirectoryChangesW), as the
# prompt requires instead of polling. Mature, widely used (cargo-watch, mdBook,
# rust-analyzer ecosystem). The stable 8.x line is used on purpose; the 9.x line
# is still a release candidate. std has no file watching.
notify = "8"
# Graceful shutdown on SIGINT/SIGTERM/SIGHUP (and Ctrl-C on Windows) for watch
# mode. std has no signal handling; the crate is tiny (one extra dependency,
# nix) and only runs a handler thread.
ctrlc = { version = "3", features = ["termination"] }
# Git index access for `sync --staged`. Reads the index and HEAD tree through
# libgit2 (linked in; hooks are never run and no `git` process is spawned).
# std has none of this, and shelling out to `git` would couple the tool to an
# external executable and its configuration. Mature and maintained under the
# rust-lang organization. The same crate builds the temporary-repository test
# fixtures (dev-dependencies below repeat it for the integration tests).
git2 = "0.21.0"

[dev-dependencies]
git2 = "0.21.0"
# Property-based tests for path composition and the analyzer's "never panics,
# always deterministic" invariants, where examples cannot cover the input space.
proptest = "1"
# Statistical benchmarks for the expensive stages (benches/pipeline.rs). The
# phase documents deliberately report ad-hoc observations as such; this makes
# them reproducible with `cargo bench`.
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Unwrap/expect must be justified. Tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
